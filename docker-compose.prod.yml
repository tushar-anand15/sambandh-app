# Production overrides - use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  db:
    ports: []
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports: []
    command: >
      sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    volumes:
      - ./frontend/.secrets:/secrets:ro
    environment:
      DATABASE_URL: postgresql://sambandh:sambandh@db:5432/sambandh
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcs-credentials.json
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    volumes: []
    depends_on:
      - backend
    restart: always
