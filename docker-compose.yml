services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sambandh
      POSTGRES_PASSWORD: sambandh
      POSTGRES_DB: sambandh
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sambandh"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sambandh:sambandh@db:5432/sambandh
      JWT_SECRET: dev-secret-change-in-production-abc123xyz
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcs-credentials.json
    command: >
      sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./frontend/.secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
