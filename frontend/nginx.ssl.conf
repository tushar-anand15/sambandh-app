server {
    listen 80;
    server_name gramsambandh.co.in www.gramsambandh.co.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gramsambandh.co.in www.gramsambandh.co.in;

    ssl_certificate /etc/letsencrypt/live/gramsambandh.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gramsambandh.co.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # pdf.js loads its worker with a dynamic import, and a browser refuses to
    # execute a module served as anything but JavaScript. nginx's bundled
    # mime.types has no entry for .mjs, so the worker came back as
    # application/octet-stream and the PDF drawer failed with "Failed to fetch
    # dynamically imported module".
    #
    # default_type rather than a types block: a types block in a nested context
    # replaces the inherited map instead of extending it, which would drop the
    # type of every other file. A regex location also wins over the /assets
    # prefix above, so the caching that location applies is repeated here --
    # these are content-hashed filenames like every other built asset.
    location ~ \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Boundary layer files. /api/maps points at /geo/<file>.geojson, which the
    # backend serves from its configured GEO_DIR. Without this the SPA fallback
    # below would answer a layer download with index.html.
    location /geo {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A 57 MB layer takes longer than a JSON answer.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
