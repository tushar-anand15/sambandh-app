<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GramSAMBANDH</title>

    <!--
      The mark, in the tab. public/favicon.svg is the primary and carries the
      reasoning; the two PNGs are rasterised from it for the clients that will
      not take an SVG icon (Safari on iOS, and anything reading the icon into a
      fixed-size bitmap slot such as a bookmark bar or a homescreen tile).

      Order matters. A browser that understands image/svg+xml takes the first
      line and stops, so the SVG wins wherever it can; the sized PNG is the
      fallback rather than the default. All three are same-origin files Vite
      copies from public/ — no icon CDN, same rule as the fonts below.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!--
      No font host. The two families are vendored into public/fonts/ and
      declared in src/index.css; the page makes zero external requests, and a
      <link> to a font CDN is both a render-block on someone else's uptime and
      a third party watching every visitor.

      Only the roman face is preloaded. It is on every page; the italic is
      occasional and Malayalam is conditional on the content, and a preload
      that the page does not use within a few seconds is a warning in the
      console and bandwidth taken from something that was needed.

      crossorigin is REQUIRED here even though the file is same-origin. Fonts
      are fetched in CORS mode, so a preload without it lands in a different
      cache partition from the @font-face request and the file is downloaded
      twice — the exact opposite of what the preload is for.

      The version in the filename is deliberate: nginx serves /fonts/ with
      immutable for a year, and this href has to move when the bytes do.
      src/test/no-external-fonts.test.ts asserts this path resolves to a file
      that the build actually emitted.
    -->
    <link
      rel="preload"
      href="/fonts/PublicSans-Roman-VF-v2001.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
