[project]
name = "gramsambandh-backend"
version = "0.1.0"
description = "GramSAMBANDH API — search and chat over Kerala municipal project records"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "pgvector>=0.3",
    "google-cloud-storage>=2.0",
    "litellm>=1.80",
    "langchain>=1.2",
    "langchain-core>=1.2",
    "langchain-litellm>=0.6",
    "langgraph>=1.1",
    "sse-starlette>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
embedding = [
    "torch>=2.0",
    "FlagEmbedding>=1.2",
    "sentence-transformers>=3.0,<4",
    "transformers>=4.40,<5",
    "einops>=0.8",
]

[tool.uv]
constraint-dependencies = [
    "torch>=2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
