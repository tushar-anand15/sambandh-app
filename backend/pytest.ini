[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers

# Every test in this suite talks to a real Postgres holding the fixture slice,
# and asyncpg pools are bound to the loop that created them — so the pool, the
# ASGI client and the tests all share one session-scoped event loop.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

markers =
    integration: marks tests as integration tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
